version: "2"

linters:
  default: none
  enable:
    - copyloopvar
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/yaling888/quirktiva)
        - default
    gofumpt:
      module-path: github.com/yaling888/quirktiva
    goimports:
      local-prefixes:
        - github.com/yaling888/quirktiva

run:
  concurrency: 4
  # go: '1.22'
  timeout: 5m
